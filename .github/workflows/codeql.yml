name: Analysis

on:
  push:
    branches: [ "main" ]
  pull_request:
    # Run on pull requests targeting the main branch
    branches: [ "main" ]
  schedule:
    # Schedule to run at 00:00 every Sunday to scan for new vulnerabilities
    - cron: '0 0 * * 0'

jobs:
  analyze:
    name: Analyze Code Quality
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
      security-events: write

    strategy:
      fail-fast: false
      matrix:
        # Automate analysis for JavaScript and TypeScript
        language: [ 'javascript-typescript' ]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v4
        with:
          languages: ${{ matrix.language }}
          # You can add stricter configuration rulesets here if needed

      # Execute CodeQL automated analysis process
      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v4
        with:
          category: "/language:${{matrix.language}}"
