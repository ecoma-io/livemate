name: PR Verification

on:  
  pull_request:
    branches:
      - main 
  merge_group: 
    branches:
      - main

jobs:

  verify:
    name: Typecheck, Lint, Test, and Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v6
        with:
          fetch-depth: 0 

      - name: Setup Node.js & pnpm
        uses: ./.github/actions/setup     
      
      - name: Derive appropriate SHAs for base and head for `nx affected` commands
        uses: nrwl/nx-set-shas@v5

      - name: Run linting for affected projects
        run: pnpm nx affected -t lint

      - name: Run type checking for affected projects
        run: pnpm nx affected -t typecheck
        
      - name: Run tests for affected projects
        run: pnpm nx affected -t test
        
      - name: Run build for affected projects
        run: pnpm nx affected -t build

  e2e:
    name: End-to-End Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v6
        with:
          fetch-depth: 0 

      - name: Setup Node.js & pnpm
        uses: ./.github/actions/setup
        with:
          install-playwright: 'true'

      - name: Derive appropriate SHAs for base and head for `nx affected` commands
        uses: nrwl/nx-set-shas@v5

      - name: Run end-to-end tests
        run: pnpm nx affected -t e2e